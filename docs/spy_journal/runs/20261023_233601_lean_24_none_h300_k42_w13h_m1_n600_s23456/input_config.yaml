general:
  stop_time: 68400s
  simulation_seed: 23456
  bootstrap_end_time: 54000s
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  runahead: 100ms
  process_threads: 2
  native_preemption: true
  reachable_fraction: 0.01
  mining:
    mode: native
    chain_snapshot: auto
  emission:
    mode: tail
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
    sim-log-txrelay: txrelay.jsonl
    sim-subnet-dedup: '24'
  wallet_defaults:
    log-level: 0
network:
  path: gml_processing/5000_nodes_caida_with_loops.gml
  peer_mode: Dynamic
  distribution:
    strategy: Weighted
    prefix_sharing:
      fraction: 0.31
      per_prefix: 3
    weights:
      north_america: 58
      europe: 30
      asia: 9
      oceania: 3
      south_america: 0
      africa: 0
