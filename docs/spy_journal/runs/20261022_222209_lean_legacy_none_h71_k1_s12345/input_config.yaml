general:
  stop_time: 21600s
  simulation_seed: 12345
  bootstrap_end_time: 7200s
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  runahead: 100ms
  process_threads: 2
  native_preemption: true
  reachable_fraction: 0.01
  mining:
    mode: native
    chain_snapshot: auto
  emission:
    mode: tail
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
    sim-log-txrelay: txrelay.jsonl
    sim-subnet-dedup: legacy
  wallet_defaults:
    log-level: 0
network:
  path: gml_processing/5000_nodes_caida_with_loops.gml
  peer_mode: Dynamic
  distribution:
    strategy: Weighted
    prefix_sharing:
      fraction: 0.31
      per_prefix: 3
    weights:
      north_america: 58
      europe: 30
      asia: 9
      oceania: 3
      south_america: 0
      africa: 0
agents:
  miner-001:
    daemon: 'monerod-sim'
    wallet: 'monero-wallet-rpc'
    script: agents.autonomous_miner
    start_time: 0s
    hashrate: 10
    can_receive_distributions: true
    daemon_options:
      out-peers: 100
      in-peers: 100
      hide-my-port: false
  miner-002:
