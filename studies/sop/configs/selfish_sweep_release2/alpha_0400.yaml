# Selfish-mining alpha-sweep, CONSERVATIVE release (release_lead: 2)
# (docs/20260921_selfish_release2_results.md). 3 + 3 = 6 honest vs 4 attacker -> alpha = 0.40.
# Identical to test_configs/selfish_sweep/alpha_0400.yaml except the
# release_lead attribute, so each point compares directly against the
# archived ES sweep at the same alpha. Theory at gamma=0 (Lee-Kim Eq.2 / ES):
# alpha=0.40: modified 0.364, Eyal-Sirer 0.484.
general:
  stop_time: 6h
  simulation_seed: 12345
  bootstrap_end_time: 10m
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  process_threads: 2
  native_preemption: true
  mining:
    mode: native
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 1
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  honest-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 3
    start_time: 0s
  honest-002:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 3
    start_time: 0s
  attacker-miner:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.selfish_miner
    hashrate: 4
    start_time: 0s
    daemon_options:
      offline: true
    attributes:
      strategy: eyal_sirer
      bridge_agent: attacker-bridge
      attack_start_height: "0"
      reaction_delay_ms: "200"
      release_lead: "2"
  attacker-bridge:
    daemon: monerod
    script: agents.selfish_bridge
    start_time: 0s
  relay-001:
    daemon: monerod
    start_time: 30s
  relay-002:
    daemon: monerod
    start_time: 60s
  simulation-monitor:
    script: agents.simulation_monitor
    poll_interval: 300
