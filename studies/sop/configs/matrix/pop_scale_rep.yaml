# Replication (n=2) of the full mid-scale table (pop_scale): stock ES
# 0.387, exact 0.170, honest controls 0.386/0.367 — all n=1, and the
# ~10% honest-throughput cost of the exact variant is a single-run
# comparison. Cells IDENTICAL to pop_scale, new matrix name; independent
# draw from native-preemption timing.
name: pop_scale_rep
base: test_configs/selfish_scaled_mid.yaml
parallel: 1
axes:
  strategy:
    es:     {attacker: {attributes: {strategy: eyal_sirer}}}
    honest: {attacker: {attributes: {strategy: honest}}}
  countermeasure:
    none: {}
    exact: {honest: {daemon_options: {sim-publish-or-perish: true, sim-pop-uncles-header: true, sim-pop-det-tie: true}}}
