# MRL #144 EXACT uncles at mid scale (6 miners + 16 relays, 23 hosts, α = 0.40)
# with their stock pairs — SECOND draw (cells identical to pop_exact_mid.yaml,
# own simulation seed 54321) of an n=2 pair (review §3 step 4:
# "micro + mid"). Base test_configs/selfish_scaled_mid.yaml UNCHANGED (genesis
# fakechain, no snapshot): the mid-scale det-tie rows the manuscript retains
# ({0.170, 0.285} vs stock {0.387, 0.463}, pop_scale{,_r2} on the 24-core
# box) were measured on it, so this is the direct exact-vs-det-tie comparison
# at scale. The stock cells are re-run here because no mid-scale run exists on
# this box or on the fixed daemon (the runner needs the pairs in one place for
# scripts/matrix_pairs.py).
#
# Runs on the daemon with both 2026-09-26 exact fixes: the verifier's sibling
# anchor (F5c) and the template refresh on sibling-alt arrival (F5d). At micro
# scale (pop_exact_h10) the exact variant collapsed to det-tie BY CONSTRUCTION:
# with gamma ~= 0 the attacker's tie block never reaches an honest miner on its
# own (the unflagged bridge stores it as an alternative and relays nothing),
# so honest templates never had a sibling to embed. Here six honest miners
# race each other naturally, and those ties DO propagate — the first setting
# in this campaign where the uncle term can act.
#
# First draw: pop_exact_mid.yaml (base seed 12345). Launched by the campaign
# driver alone (12 mid cells ≈ 20 GB each; parallel 3 per draw => 6 at once).
#
#   venv/bin/python scripts/selfish_matrix.py test_configs/matrix/pop_exact_mid_rep.yaml
name: pop_exact_mid_rep
seed: 54321
base: test_configs/selfish_scaled_mid.yaml
parallel: 3
axes:
  strategy:
    es:     {attacker: {attributes: {strategy: eyal_sirer}}}
    es_r2:  {attacker: {attributes: {strategy: eyal_sirer, release_lead: "2"}}}
    honest: {attacker: {attributes: {strategy: honest}}}
  countermeasure:
    exact: {honest: {daemon_options: {sim-publish-or-perish: true, sim-pop-uncles-header: true, sim-pop-det-tie: true}}}
    none:  {}
