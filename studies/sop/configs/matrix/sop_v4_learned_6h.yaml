# sop_v4_learned_6h (2026-10-25): the 6 h smoke cell for the LEARNED attacker
# (ladder step 4 of docs/superpowers/plans/2026-10-25-sop-rl-attacker.md):
# sop_v4_learned_72h's a045 s1 cell with stop_time 6h. Before any 72 h cell:
# grep the attacker log for reveals, rejected reveals, the `learned:`
# counter line (fallback and clipped rates) and compare the stored-hit
# fraction with `sop_rl.py eval`'s for the same policy.
name: sop_v4_learned_6h
seed: 27791
base: test_configs/selfish_micro_sop.yaml
parallel: 1
stop_time: 6h
axes:
  arm:
    share:
      attacker:
        attributes:
          strategy: learned
          reject_aware: 'true'
          embedded_shares: 'true'
          window_rule: '20261020'
          window_objects: '32'
          weigh: sop
          use_honest_shares: 'true'
          tip_shares: 'true'
          count_own_tip_shares: 'false'
          give_up_depth: '5'
          give_up_objects: '5'
        daemon_options:
          sim-share-or-perish: true
          sim-sop-w: 16
  countermeasure:
    sop2_learned:
      honest:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      relays:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
      bridges:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
  alpha:
    a045:
      attacker:
        hashrate: 4.5
        attributes: {policy_file: data/sop_rl/policy_noown_a045.json.gz, alpha: '0.45'}
      honest: {hashrate: [2.75, 2.75]}
  sample:
    s1:
      attacker:
        attributes:
          sample: '1'
