# MRL #144 EXACT uncles on the h10 chain-snapshot base — SECOND draw of the
# n=2 pair: cells identical to pop_exact_h10.yaml, own simulation seed 54321
# (the seed of pop_sop2_h10_rep, so its stock rows pair with these).
# (docs/20260925_e4_code_data_review.md §3 step 4, owner decision
# 2026-09-26: re-run the exact cells).
#
# Every earlier `*_exact` cell measured pop-core + det-tie: the uncle-header
# bonus never counted (review F4/F5b), and after those fixes the verifier still
# read the sibling anchor from the MAIN chain at height-2, so a containing
# block three or more deep in an alt chain had every legitimate uncle rejected
# (2026-09-26 patch review, finding 5; fixed in patches/monero-sim-pop.patch the
# same day, smoke-gated). This matrix is the first measurement of the exact
# variant as MRL #144 specifies it.
#
# Base: test_configs/selfish_micro_sop.yaml (h10 graft, real DAA, attacker at
# 0 s) — the SAME base and seeds as pop_sop2_h10{,_rep}, whose es_stock /
# es_r2_stock / honest_stock rows are the stock pairs for these cells, and
# whose sop2 rows are the countermeasure comparison. Flags on the honest miners
# only (relays, seeds and the covert bridge keep stock rules — attackers don't
# upgrade), exactly as every PoP cell since pop_pilot.
#
# First draw: pop_exact_h10.yaml (base seed 12345).
#
# Gate: every row's `health` must read ok (reorgs started == succeeded, zero
# add_new_block exceptions, attacker blocks found); forks_seen > 0 on the
# attack cells before reading share numbers; the honest control needs no forks.
#
#   venv/bin/python scripts/selfish_matrix.py test_configs/matrix/pop_exact_h10_rep.yaml
#
# parallel: 3 — runs alongside its _rep and the sop2_h10_ctl pair (10 cells at
# once, ~11.5 GB each measured 2026-09-26) on the 64-core / 251 GB box.
name: pop_exact_h10_rep
seed: 54321
base: test_configs/selfish_micro_sop.yaml
parallel: 3
axes:
  strategy:
    es:     {attacker: {attributes: {strategy: eyal_sirer}}}
    es_r2:  {attacker: {attributes: {strategy: eyal_sirer, release_lead: "2"}}}
    honest: {attacker: {attributes: {strategy: honest}}}
  countermeasure:
    exact: {honest: {daemon_options: {sim-publish-or-perish: true, sim-pop-uncles-header: true, sim-pop-det-tie: true}}}
