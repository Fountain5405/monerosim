# Share-aware deep-reorg hunter (2026-10-19): use_honest_shares hands the
# attacker's offline miner the honest shares SoP's slot rule lets it use (those
# on its fork point before its first block, those on the honest tip after it
# gives up), as tevador's simulated attacker has (results doc section 6).
# Needs monerod-sim with the share RPCs (sim-pop patch 2026-10-19; setup.sh
# --sim-binary). The agent logs an ERROR and uses no shares without them.
# SoP at alpha 0.45, 72 h, the same cells as deep_hunt_sop_a045 but with the
# attacker using honest shares. Model B (sop_race_model.py hunt, d2, release 10):
# 6.15 10+ reorgs per canonical day with honest shares, 5.3 without, so about 17
# against 14 reveals in the run's ~2.7 canonical days. Poisson noise hides that
# difference (separating it at 2 sigma needs ~60 canonical days); the run checks
# that the daemon attacker matches Model B's with-shares column, and the logs show
# the mechanics (honest shares in the first block after a fork, level restarts).
name: deep_hunt_sop_hs_a045
seed: 13681
base: test_configs/selfish_micro_sop.yaml
parallel: 1
stop_time: 72h
axes:
  arm:
    share:
      attacker:
        attributes:
          strategy: deep_hunt
          release_depth: '10'
          reject_aware: 'true'
          window_objects: '48'
          weigh: sop
          embedded_shares: 'true'
          use_honest_shares: 'true'
        daemon_options:
          sim-share-or-perish: true
          sim-sop-w: 16
  countermeasure:
    sop2:
      honest:
        daemon_options:
          sim-share-or-perish: true
          sim-sop-w: 16
      relays:
        daemon: monerod-sim
        daemon_options:
          sim-share-or-perish: true
      bridges:
        daemon: monerod-sim
        daemon_options:
          sim-share-or-perish: true
  alpha:
    a045:
      attacker:
        hashrate: 4.5
      honest:
        hashrate:
        - 2.75
        - 2.75
  depth:
    d2:
      attacker:
        attributes:
          give_up_depth: '2'
ksm: true
bootfast: true
