# Second draw (n=2) of pop_sop2_h10 — see that spec's header for the design.
# Cells IDENTICAL to pop_sop2_h10; new matrix name so the runner does not
# resume into the first draw's markers; its own simulation seed so the second
# draw is independent in topology sampling as well as native-preemption timing
# (the earlier *_rep specs kept seed 12345 and varied only in timing).
# Pairing is preserved: every cell in THIS matrix shares seed 54321, as every
# cell in pop_sop2_h10 shares the base's 12345.
#
#   venv/bin/python scripts/selfish_matrix.py test_configs/matrix/pop_sop2_h10_rep.yaml
name: pop_sop2_h10_rep
base: test_configs/selfish_micro_sop.yaml
seed: 54321
parallel: 6
axes:
  strategy:
    es:     {attacker: {attributes: {strategy: eyal_sirer}}}
    es_r2:  {attacker: {attributes: {strategy: eyal_sirer, release_lead: "2"}}}
    honest: {attacker: {attributes: {strategy: honest}}}
  countermeasure:
    sop2:
      honest: {daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}}
      relays: {daemon: monerod-sim, daemon_options: {sim-share-or-perish: true}}
      bridges: {daemon: monerod-sim}
    stock: {}
