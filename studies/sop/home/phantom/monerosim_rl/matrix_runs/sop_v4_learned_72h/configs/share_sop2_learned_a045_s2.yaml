general:
  fallback_seeds: custom
  stop_time: 72h
  simulation_seed: 27791
  bootstrap_end_time: 10m
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  process_threads: 2
  native_preemption: true
  mining:
    mode: native
    chain_snapshot: h10
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 1
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  honest-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 2.75
    start_time: 0s
    daemon_options:
      sim-share-or-perish: true
      sim-sop-w: 16
  honest-002:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 2.75
    start_time: 0s
    daemon_options:
      sim-share-or-perish: true
      sim-sop-w: 16
  attacker-miner:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.selfish_miner
    start_time: 0s
    hashrate: 4.5
    daemon_options:
      offline: true
      sim-share-or-perish: true
      sim-sop-w: 16
    wallet_options:
      log-level: 0,wallet.wallet2:ERROR
    attributes:
      strategy: learned
      bridge_agent: attacker-bridge
      attack_start_height: '0'
      reaction_delay_ms: '200'
      reject_aware: 'true'
      embedded_shares: 'true'
      window_rule: '20261020'
      window_objects: '32'
      weigh: sop
      use_honest_shares: 'true'
      tip_shares: 'true'
      count_own_tip_shares: 'false'
      give_up_depth: '5'
      give_up_objects: '5'
      policy_file: data/sop_rl/policy_noown_a045.json.gz
      alpha: '0.45'
      sample: '2'
  attacker-bridge:
    daemon: monerod-sim
    script: agents.selfish_bridge
    start_time: 0s
    daemon_options:
      sim-share-or-perish: true
  relay-001:
    daemon: monerod-sim
    start_time: 30s
    daemon_options:
      sim-share-or-perish: true
  relay-002:
    daemon: monerod-sim
    start_time: 60s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-001:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-002:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-003:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-004:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-005:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-006:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  simulation-monitor:
    script: agents.simulation_monitor
    poll_interval: 300
