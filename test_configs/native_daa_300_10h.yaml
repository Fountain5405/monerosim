# Native mining at scale + difficulty-adjustment test (docs/NATIVE_MINING.md).
# Derived from cuprate_exp_baseline_300_8h.yaml (306 hosts: 5 miners, 50 tx users,
# 245 stock-monerod relays, 6 seeds, distributor, monitor). Differences:
#   - general.mining.mode: native  -> miners run monerod-sim, real RandomX, monerod's own LWMA
#   - hashrate is LITERAL hashes/second: miners 001-005 = 20 h/s each (100 h/s, D_eq ~12000)
#   - miner-006 joins at 4h with 200 h/s (network -> 300 h/s, D_eq ~36000)
#   - stop_time 10h
# Pre-registered expectations (set before the run, 2026-09-10):
#   D plateau within +-25% of 12000 in hours 0-4; ~120 s/block in hours 1-4; burst toward
#   ~40 s/block right after 4h; D 25000-36000 by 10h (LWMA uses the whole history until 600
#   blocks, so the retarget takes hours); last-2h interval 90-130 s; miner-006 share ~66.7%
#   from 4h on; 100% sync, 0 PoW rejections, 0 failed processes; txs created + included.
# Every validator is vanilla monerod: the run also tests stock daemons accepting native blocks.
general:
  stop_time: 10h
  simulation_seed: 20260910
  mining:
    mode: native
  bootstrap_end_time: 2h
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  runahead: 100ms
  process_threads: 0
  native_preemption: true
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 1
network:
  path: /home/lever65/monerosim_scale/monerosim/gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  miner-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 0s
    hashrate: 20
    can_receive_distributions: true
  miner-002:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 1s
    hashrate: 20
    can_receive_distributions: true
  miner-003:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 2s
    hashrate: 20
    can_receive_distributions: true
  miner-004:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 3s
    hashrate: 20
    can_receive_distributions: true
  miner-005:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 4s
    hashrate: 20
    can_receive_distributions: true
  miner-006:
    # Late joiner: 200 h/s at the 4-hour mark (2x the whole initial network).
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 14400s
    hashrate: 200
