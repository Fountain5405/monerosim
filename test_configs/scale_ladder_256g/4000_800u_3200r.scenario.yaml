# Scale ladder for a 256 GB box, 4000-node rung: 5 miners, 800 users, 3200 relays.
#
# Same workload as test_configs/scale_ladder_box32/ (the 32 GB ladder of 2026-10-19), so results
# line up rung for rung: derived from test_configs/scale_ladder/1k_200u_800r.scenario.yaml
# (same seed, native mining, 5k CAIDA GML, RPC SSL autodetect, 1 tx/user/300 s, users and
# miners at monitor, relays at log-level 0).
#
# One difference from box32: users and relays start linearly (users one per 15 s from 40 min,
# relays one per 10 s from 20 min) instead of `start_time_stagger: auto`. Auto is batched: waves
# double up to 200 agents 5 s apart, up to 24 starts per sim-minute with users and relays
# overlapping. With --bootfast a start costs almost no wall time, so each wave lands within wall
# minutes, and its unmerged 256 MB RandomX caches outrun KSM: the RAM peak then measures the
# waves, not the network (the X0 pilot, archived_runs/20261020_130027_x0_legacy_none_s12345,
# ran a 32 GB box out of RAM that way at ~320 daemons). Linear caps starts at 10 per sim-minute.
#
# stop_time below is a placeholder: scripts/run_scale_ladder.sh expands the rung on the box
# that runs it and sets stop_time = last user's activity start + 2 h (min 8 h). The activity
# stagger comes from that box's calibration (~/.monerosim/calibration.json), so it differs
# between machines.
#
# Run:    scripts/run_scale_ladder.sh <out_dir> test_configs/scale_ladder_256g/4000_800u_3200r.scenario.yaml
general:
  stop_time: 8h                        # placeholder: set by scripts/run_scale_ladder.sh
  simulation_seed: 12345
  bootstrap_end_time: auto            # Calculated from agent spawn times
  enable_dns_server: true
  mining:
    mode: native                       # real RandomX + monerod LWMA; hashrate = literal h/s
  shadow_log_level: warning
  progress: true
  runahead: 100ms
  process_threads: 2
  native_preemption: false
  daemon_defaults:
    log-level: monitor
    rpc-ssl: autodetect                # see header: RPC replies stall in Shadow without TLS
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 0
    rpc-ssl: autodetect
    daemon-ssl: autodetect

network:
  path: gml_processing/5000_nodes_caida_with_loops.gml
  peer_mode: Dynamic

agents:
  # --- 5 Miners: Generate blocks, hashrates must sum to 100 ---
  miner-{001..005}:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 0s
    start_time_stagger: 1s          # 1s stagger for small miner group
    hashrate: [20, 20, 20, 20, 20]  # Total = 100 (required for initial miners)
    can_receive_distributions: true

  # --- 800 Users: linear spawning, one per 15 s (see header) ---
  user-{001..800}:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.regular_user
    start_time: 2400s               # after the first relays, as auto's first batch was
    start_time_stagger: 15s         # linear; auto's batched waves outrun KSM (header)
    transaction_interval: 300
    activity_start_time: auto
    can_receive_distributions: true

  # --- 3200 Relay Nodes: Daemon-only, linear spawning, one per 10 s ---
  # No wallet or script - just monerod for network realism
  relay-{0001..3200}:
    daemon: monerod
    start_time: 1200s               # as auto's first batch
    start_time_stagger: 10s         # linear (header)
    daemon_options:
      log-level: 0                  # disk: relays quiet, users+miners at monitor

  miner-distributor:
    script: agents.miner_distributor
    wait_time: auto

  simulation-monitor:
    script: agents.simulation_monitor
    poll_interval: 300
