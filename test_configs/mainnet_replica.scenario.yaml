# MAINNET REPLICA: a scaled-down (1,000 honest daemons) model of the Monero
# mainnet P2P topology, plus a clustered spy population.
#
# DRAFT, NOT YET RUN. An earlier revision expanded and generated cleanly; this
# revision uses three keys that do not exist yet (turnover: true = G2,
# prefix_sharing = G5, mining.chain_snapshot = G6) and will not generate until
# they land. Design:  docs/superpowers/specs/2026-09-23-mainnet-replica-design.md
# Numbers:           docs/20260923_mainnet_topology_literature.md  (S1..S10 below)
#
# Honest population (995 daemons + 6 auto seed hosts), classed by outbound
# degree as in S1:
#   heavy   5  miner-*       pool hubs, native mining, 256/256 caps (S1 pools
#                            are the biggest hubs; caps validated in S10) +
#                            6 auto seed hosts (S1's other heavy class)
#   medium 125  medium-*     12.5% (S1), out-peers 16/32/64; pinned reachable,
#                            still turning over (G2)
#   light  865  user-*, relay-*, observer-*  (default 12 out)
#   Reachable ≈ 16% (S10 target 15%): 150 pinned + 0.01 of the 840 users/relays.
#   Turnover 1 h on / 1 h off on users, relays, medium (S10's mainnet match).
#   Honest /24 sharing per S11 via prefix_sharing (G5).
#
# Spy population, "2024" preset (S6): ~40% of reachable IPs, 6 dense /24s.
#   108 spies = 0.40/0.60 x ~160 honest reachable, as 6 groups of 18. Each
#   group is pinned to ONE GML node, and one GML node is one /24, so
#   monerod's /24 deduplication (S8/S9) sees 6 subnets, as on mainnet.
#   Variant R (real-node spies, below): stock monerod, big caps, always on.
#   Variant P (proxy spies): commented template at the bottom; needs
#   agents/spy_proxy.py (spec gap G3).
#   Other presets (swap the spy groups): "2025" 14.7%, 7 /24s (S4);
#   "2026" 81.6% (S5), ~14 dense /24s + a long scattered tail (S7), which
#   needs variant P for affordable memory.
#
# Placement: 5,000-node GML so honest nodes almost never share a /24 (shared
# /24s would couple them through deduplication). Weighted regions NA/EU/AS/OC
# = 58/30/9/3 (S1 light-node countries, derived). Weighted placement fills a
# region from its first node, so honest NA nodes take ~0..650; spies are pinned
# to NA nodes 828..833 to keep their /24s spy-only.
general:
  stop_time: 16h            # the >6h-connection-tail metric needs the long window (S10)
  simulation_seed: 12345
  bootstrap_end_time: auto
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  runahead: 100ms
  process_threads: 2
  native_preemption: true   # turnover restarts hit LMDB resize (S10); preemption avoids the livelock
  reachable_fraction: 0.01  # 150 pinned (5 miners, 125 medium, 20 observers) + ~8 of the 840 users/relays => ~16% of 996 honest daemons (S10 target 15%)
  mining:
    mode: native            # real RandomX, sleep-throttled (docs/NATIVE_MINING.md)
    chain_snapshot: auto    # difficulty preload (spec 2026-09-23-difficulty-preload-design.md, gap G6)
  turnover:
    mean_session: 1h        # S10: 1 h / 1 h matched mainnet median AND >6h tail
    mean_downtime: 1h
    fraction: 1.0           # pinned nodes (miners, supernodes, observers, spies) are exempt
  daemon_defaults:
    log-level: monitor      # net.p2p.msg lines for the connection + tx-arrival analysis
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 0

network:
  path: gml_processing/5000_nodes_caida_with_loops.gml
  peer_mode: Dynamic
  distribution:
    strategy: Weighted
    prefix_sharing:         # S11: 12% of BGP prefixes hold 55% of nodes (~11/prefix, an
      fraction: 0.55        # upper bound for /24s). Co-locates that share of honest
      per_prefix: 11        # daemons on shared GML nodes (= shared /24s). Gap G5.
    weights:
      north_america: 58
      europe: 30
      asia: 9
      oceania: 3
      south_america: 0
      africa: 0

agents:
  # ---------------- honest: heavy / infrastructure ----------------
  # Miners ARE the hubs: mainnet's largest hubs are pool front-ends (S1: 9 of 28
  # heavy nodes were pools). Native mining, hashrate in literal h/s; hub caps
  # ~25% of N per direction (S2: 14 hubs cover 82%). The six auto fallback seed
  # hosts (S1's other heavy class) take unlimited inbound and become hubs on
  # their own.
  miner-{001..005}:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 0s
    start_time_stagger: 1s
    hashrate: [10, 10, 10, 10, 10]        # h/s (native); D0 = 120 x 50 = 6,000. Small on purpose: sim-speed ceiling ~667/H per miner
    can_receive_distributions: true
    daemon_options:
      out-peers: 256
      in-peers: 256
      hide-my-port: false   # pinned reachable + always on

  # ---------------- honest: medium (S1 12.5%, raised out-peers) ----------------
  # Pinned reachable (public always-listening nodes) but STILL turning over —
  # `turnover: true` overrides the pinned-reachable exemption (spec gap G2;
  # not generatable until G2 lands).
  medium-a-{001..042}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: auto
    turnover: true
    daemon_options:
      out-peers: 16
      hide-my-port: false
  medium-b-{001..042}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: auto
    turnover: true
    daemon_options:
      out-peers: 32
      hide-my-port: false
  medium-c-{001..041}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: auto
    turnover: true
    daemon_options:
      out-peers: 64
      hide-my-port: false

  # ---------------- honest: light ----------------
  user-{001..200}:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.regular_user
    start_time: 1200s
    start_time_stagger: auto
    transaction_interval: 300
    activity_start_time: auto
    can_receive_distributions: true

  relay-{001..640}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: auto

  # Vantage points: always-on reachable light nodes that dump their peerlists,
  # measuring spy share of peerlists and in/out slots like S4's vantage points.
  observer-{001..020}:
    daemon: monerod-hf      # patched build: --peerlist-dump-file
    start_time: 0s
    start_time_stagger: 3s
    daemon_options:
      hide-my-port: false
      peerlist-dump-file: "peerlist_dump.jsonl"

  # ---------------- spies, variant R (real-node), "2024" preset ----------------
  # out-peers 32 is a starting guess, to be calibrated in stage 2 against S4's
  # 20% inbound / 15% outbound spy share at honest nodes.
  spy-a-{001..018}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 828
    daemon_options: &spy_opts
      out-peers: 32
      hide-my-port: false   # reachable + turnover-exempt: spies are infrastructure
  spy-b-{001..018}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 829
    daemon_options: *spy_opts
  spy-c-{001..018}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 830
    daemon_options: *spy_opts
  spy-d-{001..018}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 831
    daemon_options: *spy_opts
  spy-e-{001..018}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 832
    daemon_options: *spy_opts
  spy-f-{001..018}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 833
    daemon_options: *spy_opts

  # ---------------- spies, variant P (proxy) — TEMPLATE, needs spec gap G3 ----------------
  # A few real backend monerods behind many lightweight front-end IPs (S7). Swap
  # in for (or mix with) variant R; keep total spy IPs at the preset's count.
  # spy-backend-{001..003}:
  #   daemon: monerod
  #   start_time: 0s
  #   topology_node: 827
  #   daemon_options: { out-peers: 64, hide-my-port: false }
  # spy-proxy-a-{001..018}:
  #   script: agents.spy_proxy
  #   start_time: 60s
  #   topology_node: 828
  #   attributes: { backend_group: spy-backend, dial_budget: "32" }

  miner-distributor:
    script: agents.miner_distributor
    wait_time: auto

  simulation-monitor:
    script: agents.simulation_monitor
    poll_interval: 300
