# sop_v4_h10_72h (2026-10-21): first campaign on the MRL #146 2026-10-20 rule
# (log v4, docs/superpowers/specs/2026-10-21-sop-rev20261020-design.md), 72 h.
# Arm of sop_v4_smoke. "hs" = attacker uses the honest shares; "built" = none.
# Both keep tip_shares (the attacker's own shares). Only four cells run, in this
# order: a033 built d2, a045 hs d5, a040 hs d2, a045 hs d2. Total hashrate 10 h/s
# in every alpha cell (a033: 3.3 + 2 x 3.35).
name: sop_v4_h10_72h
seed: 27791
base: test_configs/selfish_micro_sop.yaml
parallel: 1
stop_time: 72h
axes:
  arm:
    share:
      attacker:
        attributes:
          strategy: window_stubborn
          reject_aware: 'true'
          embedded_shares: 'true'
          window_rule: '20261020'
          window_objects: '32'
          weigh: sop
          use_honest_shares: 'true'
          tip_shares: 'true'
          give_up_depth: '5'
        daemon_options:
          sim-share-or-perish: true
          sim-sop-w: 16
  countermeasure:
    sop2:
      honest:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      relays:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
      bridges:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
  shares:
    hs:
      attacker:
        attributes:
          use_honest_shares: 'true'
          tip_shares: 'true'
    built:
      attacker:
        attributes:
          use_honest_shares: 'false'
          tip_shares: 'true'
  alpha:
    a033:
      attacker: {hashrate: 3.3}
      honest: {hashrate: [3.35, 3.35]}
    a040:
      attacker: {hashrate: 4}
      honest: {hashrate: [3, 3]}
    a045:
      attacker: {hashrate: 4.5}
      honest: {hashrate: [2.75, 2.75]}
  depth:
    d5:
      attacker:
        attributes:
          give_up_depth: '5'
    d2:
      attacker:
        attributes:
          give_up_depth: '2'
exclude:
- {shares: built, alpha: a033, depth: d5}
- {shares: built, alpha: a040}
- {shares: built, alpha: a045}
- {shares: hs, alpha: a033}
- {shares: hs, alpha: a040, depth: d5}
ksm: true
bootfast: true
