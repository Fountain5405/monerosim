# sop_v4_window_k6_a048_72h (2026-10-27): follow-up to sop_v4_window_72h. At
# alpha 0.47 its K=6 cells (window 80 objects) ran 0.454 / 0.436 against the
# race model's 0.399 (+0.046 on the pair) with 35% more reveals per found
# block than the model, while its K=2 cells matched (0.546 / 0.493 vs 0.514).
# At 0.48 the model puts K=6's best attacker at break-even (G=8 R=1: share
# 0.476, 28.9 reveals per 1,000 found blocks, network orphan rate 0.394;
# data/sop_search/kw_perish_047.jsonl, perish rule on): if the sims' K=6
# excess holds, the attack pays here (about 0.52). Same network, options and
# attacker as the k6 cells except alpha and the give-up threshold (8 objects,
# the model's best at 0.48; at 0.47 it scored within 0.002 of G=4). One lane
# per 16 GB box.
name: sop_v4_window_k6_a048_72h
seed: 27791
base: test_configs/selfish_micro_sop.yaml
parallel: 1
stop_time: 72h
axes:
  arm:
    share:
      attacker:
        attributes:
          strategy: param_stubborn
          reject_aware: 'true'
          embedded_shares: 'true'
          window_rule: '20261020'
          weigh: sop
          use_honest_shares: 'true'
          tip_shares: 'true'
          count_own_tip_shares: 'false'
          give_up_depth: '5'
          hold_shares: '1'
          publish_lead: '1'
          reveal_margin: '1'
          block_deficit: '0'
        daemon_options:
          sim-share-or-perish: true
          sim-sop-w: 16
  countermeasure:
    k6:
      attacker:
        attributes: {window_objects: '80', give_up_objects: '8', reveal_depth: '1'}
        daemon_options: {sim-sop-k: 6}
      honest:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16, sim-sop-k: 6}
      relays:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16, sim-sop-k: 6}
      bridges:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16, sim-sop-k: 6}
  alpha:
    a048:
      attacker: {hashrate: 4.8}
      honest: {hashrate: [2.6, 2.6]}
  sample:
    s1:
      attacker:
        attributes:
          sample: '1'
    s2:
      attacker:
        attributes:
          sample: '2'
    s3:
      attacker:
        attributes:
          sample: '3'
