# P2P BAN CASCADE FIX CHECK (2026-10-07, plan agreed with the owner
# 2026-10-06), first seed (12345). stubborn_h10_banlog{,_rep,_rep2} showed
# the cause: stock monero scores a peer down whenever its height drops
# ("Claims N, claimed M before"), and a SoP node drops height legitimately
# when it switches to a branch with fewer blocks but more share weight. All
# 67 bans replayed exactly from those hits. monerod-sim now skips that score
# under SoP (hit_score in patches/monero-sim-pop.patch, logged as "SIM-SoP:
# peer height drop not scored"). These are the banlog cells unchanged, on
# that binary and still with net.cn:DEBUG: expect the hits, but no score-5
# drop and no ban. Shadow stays v0.2.4, like every campaign 7 run.
#
#   venv/bin/python scripts/selfish_matrix.py test_configs/matrix/stubborn_h10_banfix.yaml
name: stubborn_h10_banfix
seed: 12345
base: test_configs/selfish_micro_sop.yaml
parallel: 1
stop_time: 240h
axes:
  arm:
    share:
      attacker:
        attributes: {strategy: window_stubborn, reject_aware: "true", embedded_shares: "true", window_objects: "48", weigh: sop}
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
  countermeasure:
    sop2:
      honest: {daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}}
      relays: {daemon: monerod-sim, daemon_options: {sim-share-or-perish: true}}
      bridges: {daemon: monerod-sim, daemon_options: {sim-share-or-perish: true}}
  alpha:
    a033: {attacker: {hashrate: 3.3}, honest: {hashrate: [3.35, 3.35]}}
  depth:
    d5: {attacker: {attributes: {give_up_depth: "5"}}}
  log:
    netcn_debug: {all: {daemon_options: {log-level: "*:WARNING,blockchain:INFO,txpool:INFO,net.p2p.msg:INFO,daemon.rpc:INFO,global:INFO,stacktrace:INFO,logging:INFO,msgwriter:INFO,verify:FATAL,serialization:FATAL,perf.*:FATAL,net.cn:DEBUG"}}}
