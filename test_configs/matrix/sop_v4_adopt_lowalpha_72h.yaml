# sop_v4_adopt_lowalpha_72h (2026-10-30): partial adoption with the attacker
# BELOW every honest group (owner 10-30 "proceed"). At 0.45 the attacker (4.5)
# outweighed whichever honest group it fought and took ~0.88 of the chain at
# 25 / 50 / 75 % adoption. Here the attacker has 3.0 and each honest pool 1.75
# (stock group 5.25 / SoP group 1.75 at k1; 3.5 / 3.5 at k2), with the stock
# rule's d2 attacker at k0 as the reference. Same attacker knobs as at 0.45 (a
# lower bound on what partial adoption gives away). Identical to the a045 cells
# except the hashrates (test pins it). 14 daemons, 5 mining: phantom / lithium.
name: sop_v4_adopt_lowalpha_72h
seed: 27791
base: test_configs/selfish_micro_sop_h4.yaml
parallel: 1
stop_time: 72h
axes:
  arm:
    share:
      attacker:
        attributes: {strategy: param_stubborn, reject_aware: 'true', embedded_shares: 'true', window_rule: '20261020',
          window_objects: '32', weigh: sop, use_honest_shares: 'true', tip_shares: 'true', count_own_tip_shares: 'false',
          give_up_depth: '5', give_up_objects: '6', hold_shares: '1', publish_lead: '1', reveal_margin: '1',
          reveal_depth: '1', block_deficit: '0'}
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      honest:
        wallet_options: {log-level: '0,wallet.wallet2:ERROR'}
    d2:
      attacker:
        attributes: {strategy: window_stubborn, reject_aware: 'true', embedded_shares: 'true', window_rule: '20261020',
          weigh: difficulty, window_objects: '0', use_honest_shares: 'true', tip_shares: 'true', give_up_depth: '2',
          give_up_objects: '-1'}
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      honest:
        wallet_options: {log-level: '0,wallet.wallet2:ERROR'}
  adoption:
    k0: {}
    k1:
      honest-001: &id001
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      relay-001: &id002
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
      monero-seed-001: &id003
        daemon_options: {sim-share-or-perish: true}
      monero-seed-002: &id004
        daemon_options: {sim-share-or-perish: true}
      monero-seed-003: &id005
        daemon_options: {sim-share-or-perish: true}
      bridges: &id006
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
    k2:
      honest-001: *id001
      relay-001: *id002
      monero-seed-001: *id003
      monero-seed-002: *id004
      monero-seed-003: *id005
      bridges: *id006
      honest-002:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
  alpha:
    a030:
      attacker: {hashrate: 3.0}
      honest:
        hashrate: [1.75, 1.75, 1.75, 1.75]
  sample:
    s1:
      attacker:
        attributes: {sample: '1'}
exclude:
- {arm: share, adoption: k0}
- {arm: d2, adoption: k1}
- {arm: d2, adoption: k2}
