# sop_v4_control_tail_72h (2026-10-28): tail-emission rerun of the no-attacker control pair (stock vs SoP at a047).
# Owner 10-28: "test that assumption" (that the stock emission schedule the sims
# run under cannot change the block-count results). Identical to sop_v4_control_72h.yaml
# cell for cell except general.emission = tail from the snapshot height
# (0.6 XMR per block instead of ~35 XMR; see docs/TAIL_EMISSION.md); the
# matrix's `general:` key deep-merges into the base, so no second base config.
# test_tail_reruns_match_their_originals_except_the_emission_mode pins this.
# Expect the same shares within seed noise (~0.02): a different coinbase
# changes every block hash, so this is a fresh draw, not a replay.
name: sop_v4_control_tail_72h
seed: 27791
base: test_configs/selfish_micro_sop.yaml
parallel: 1
stop_time: 72h
axes:
  arm:
    honest:
      attacker:
        attributes: {strategy: honest}
        daemon_options: {offline: false}
  countermeasure:
    stock: {}
    sop:
      attacker:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      honest:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      relays:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      bridges:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
  alpha:
    a047:
      attacker: {hashrate: 4.7}
      honest:
        hashrate: [2.65, 2.65]
  sample:
    s1:
      attacker:
        attributes: {sample: '1'}
general:
  emission: {mode: tail, from_height: auto}
