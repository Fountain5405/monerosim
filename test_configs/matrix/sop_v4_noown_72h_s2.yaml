# sop_v4_noown_72h_s2 (2026-10-22): second sample of the noown follow-up
# cell (sop_v4_noown_72h, count_own_tip_shares 'false') for a per-run
# noise estimate, paired with the second sample of its baseline cell 4
# (sop_v4_h10_72h_s2). Identical config to sop_v4_noown_72h; only the
# spec name differs, which isolates matrix_runs/ markers and archived
# run names. Runs are not seed-reproducible, so the same seed gives an
# independent sample, not a repetition. Model prediction (preset
# 20261020_noown, 2000 d, +honest shares): 0.094.
name: sop_v4_noown_72h_s2
seed: 27791
base: test_configs/selfish_micro_sop.yaml
parallel: 1
stop_time: 72h
axes:
  arm:
    share:
      attacker:
        attributes:
          strategy: window_stubborn
          reject_aware: 'true'
          embedded_shares: 'true'
          window_rule: '20261020'
          window_objects: '32'
          weigh: sop
          use_honest_shares: 'true'
          tip_shares: 'true'
          count_own_tip_shares: 'false'
          give_up_depth: '5'
        daemon_options:
          sim-share-or-perish: true
          sim-sop-w: 16
  countermeasure:
    sop2_noown:
      honest:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      relays:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
      bridges:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
  shares:
    hs:
      attacker:
        attributes:
          use_honest_shares: 'true'
          tip_shares: 'true'
  alpha:
    a045:
      attacker: {hashrate: 4.5}
      honest: {hashrate: [2.75, 2.75]}
  depth:
    d2:
      attacker:
        attributes:
          give_up_depth: '2'
ksm: true
bootfast: true
