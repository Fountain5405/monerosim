# GIVE-UP DEPTH AT ALPHA 0.33 (2026-10-04, owner decision), first seed (12345).
# Model B (scripts/sop_race_model.py deep, e1b6b9db) says SoP's 10+ block reorg
# rate depends steeply on how long the stubborn attacker holds on: at alpha
# 0.33 about 1 per 2.9 canonical years at d2, 1 per 1.35 at d3, and 1 per 0.43
# at d5. MRL #146's "about 1 per 3 years" matches only d2. These cells are
# stubborn_h10_long's share_sop2_a033_d2 cell with give_up_depth 3 and 5, at
# the same seed, so d2/d3/d5 compare draw for draw. Share arm vs SoP only: the
# question is SoP's deep-reorg rate. 240 h each, on the stale-id-fixed binary
# (pop patch 2d6499a8).
#
#   venv/bin/python scripts/selfish_matrix.py test_configs/matrix/stubborn_h10_long_depth.yaml
name: stubborn_h10_long_depth
seed: 12345
base: test_configs/selfish_micro_sop.yaml
parallel: 2
stop_time: 240h
axes:
  arm:
    share:
      attacker:
        attributes: {strategy: window_stubborn, reject_aware: "true", embedded_shares: "true", window_objects: "48", weigh: sop}
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
  countermeasure:
    sop2:
      honest: {daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}}
      relays: {daemon: monerod-sim, daemon_options: {sim-share-or-perish: true}}
      bridges: {daemon: monerod-sim, daemon_options: {sim-share-or-perish: true}}
  alpha:
    a033: {attacker: {hashrate: 3.3}, honest: {hashrate: [3.35, 3.35]}}
  depth:
    d3: {attacker: {attributes: {give_up_depth: "3"}}}
    d5: {attacker: {attributes: {give_up_depth: "5"}}}
