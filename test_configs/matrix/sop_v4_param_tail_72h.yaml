# sop_v4_param_tail_72h (2026-10-28): tail-emission rerun of the SoP headline bracket at the default window (a046 / a047, the crossing 0.4635).
# Owner 10-28: "test that assumption" (that the stock emission schedule the sims
# run under cannot change the block-count results). Identical to sop_v4_param_72h.yaml
# cell for cell except general.emission = tail from the snapshot height
# (0.6 XMR per block instead of ~35 XMR; see docs/TAIL_EMISSION.md); the
# matrix's `general:` key deep-merges into the base, so no second base config.
# test_tail_reruns_match_their_originals_except_the_emission_mode pins this.
# Expect the same shares within seed noise (~0.02): a different coinbase
# changes every block hash, so this is a fresh draw, not a replay.
name: sop_v4_param_tail_72h
seed: 27791
base: test_configs/selfish_micro_sop.yaml
parallel: 2
stop_time: 72h
axes:
  arm:
    share:
      attacker:
        attributes: {strategy: param_stubborn, reject_aware: 'true', embedded_shares: 'true', window_rule: '20261020', window_objects: '32',
          weigh: sop, use_honest_shares: 'true', tip_shares: 'true', count_own_tip_shares: 'false', give_up_depth: '5'}
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
  countermeasure:
    sop2_param:
      honest:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      relays:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
      bridges:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
  alpha:
    a046:
      attacker:
        hashrate: 4.6
        attributes: {give_up_objects: '6', hold_shares: '1', publish_lead: '1', reveal_margin: '1', reveal_depth: '1', block_deficit: '0'}
      honest:
        hashrate: [2.7, 2.7]
    a047:
      attacker:
        hashrate: 4.7
        attributes: {give_up_objects: '6', hold_shares: '1', publish_lead: '1', reveal_margin: '1', reveal_depth: '1', block_deficit: '0'}
      honest:
        hashrate: [2.65, 2.65]
  sample:
    s1:
      attacker:
        attributes: {sample: '1'}
general:
  emission: {mode: tail, from_height: auto}
