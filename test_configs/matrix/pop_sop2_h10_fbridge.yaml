# STRANDING RE-RUN (owner decision 2026-09-27): SoP v2 attack cells with the attacker's
# bridge running the SAME fork-choice rule as the SoP-flagged relays and seeds — first draw of an n=2 pair (second: pop_sop2_h10_fbridge_rep.yaml, seed 54321).
#
# In every earlier PoP/SoP attack cell the attacker's bridge kept stock fork
# choice. When the attacker released a long private branch, the stock bridge
# adopted it (more work) while the flagged miners rejected it as late; the
# attacker reads "the public chain" from its bridge, so it kept extending a
# branch the miners never accepted, for up to 47 blocks
# (docs/20260926_exact_uncles_and_sop_controls.md §5,
# scripts/attacker_stranding.py). Here the bridge runs `sim-share-or-perish` exactly like the relays, so the
# attacker sees the chain the miners accept. Nothing else changes: base,
# seeds, strategies, honest/relay flags and daemon are those of pop_sop2_h10, whose
# rows (and their stock pairs, which cannot strand) this pairs with by cell name.
#
# Side effect to record, not hide: a flagged bridge announces a released block
# only when the RULE makes it the bridge's tip. Under SoP the attacker's share-less tie block
# is light, so the bridge keeps the honest block and gamma should stay ~0.
#
#   venv/bin/python scripts/selfish_matrix.py test_configs/matrix/pop_sop2_h10_fbridge.yaml
#   venv/bin/python scripts/attacker_stranding.py pop_sop2_h10_fbridge pop_sop2_h10
name: pop_sop2_h10_fbridge
base: test_configs/selfish_micro_sop.yaml
parallel: 2
axes:
  strategy:
    es:     {attacker: {attributes: {strategy: eyal_sirer}}}
    es_r2:  {attacker: {attributes: {strategy: eyal_sirer, release_lead: "2"}}}
  countermeasure:
    sop2:
      honest: {daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}}
      relays: {daemon: monerod-sim, daemon_options: {sim-share-or-perish: true}}
      bridges: {daemon: monerod-sim, daemon_options: {sim-share-or-perish: true}}
