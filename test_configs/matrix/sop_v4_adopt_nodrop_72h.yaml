# sop_v4_adopt_nodrop_72h (2026-10-30): the mechanism of the adoption split
# (owner 10-30 "proceed"). In every partial-adoption cell with the attacker the
# stock nodes blocked their SoP peers for 24 h ("Host relay-001 blocked", day 1
# 01:25; resync from 4.8 h behind at 01:25 day 2): stock monerod scores a peer
# whose height drops, and SoP nodes reorganize to fewer-block, more-weight
# branches during an attack. The SoP patch exempts SoP nodes from that scoring;
# --sim-no-drop-score (2026-10-30) gives the same exemption to a stock-rule node.
# This is the 50 % cell at 0.45 (share_k2_a045_s1: SoP side 0.998, stock side
# 0.836, fork 418 blocks deep) with the flag on every stock-rule daemon. Second
# change, unavoidable: relay-002 runs monerod-sim instead of vanilla monerod to
# accept the flag. If the split disappears, the bans were the cause; if it
# stays, the rules themselves split the network. Needs the 10-30 nodrop build
# (lithium / phantom). test_adopt_nodrop_differs_from_k2_only_in_the_scoring pins it.
name: sop_v4_adopt_nodrop_72h
seed: 27791
base: test_configs/selfish_micro_sop_h4.yaml
parallel: 1
stop_time: 72h
axes:
  arm:
    share:
      attacker:
        attributes: {strategy: param_stubborn, reject_aware: 'true', embedded_shares: 'true', window_rule: '20261020',
          window_objects: '32', weigh: sop, use_honest_shares: 'true', tip_shares: 'true', count_own_tip_shares: 'false',
          give_up_depth: '5', give_up_objects: '6', hold_shares: '1', publish_lead: '1', reveal_margin: '1',
          reveal_depth: '1', block_deficit: '0'}
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      honest:
        wallet_options: {log-level: '0,wallet.wallet2:ERROR'}
  adoption:
    k2:
      honest-001:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      relay-001:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
      monero-seed-001:
        daemon_options: {sim-share-or-perish: true}
      monero-seed-002:
        daemon_options: {sim-share-or-perish: true}
      monero-seed-003:
        daemon_options: {sim-share-or-perish: true}
      bridges:
