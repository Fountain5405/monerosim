# 40-daemon SoP matrix (2026-10-14): sop_either_h10_long on test_configs/selfish_n40_sop.yaml,
# n_f rule 'either', KSM on, honest hashrate split over 8 miners (same total).
# Speed check: measure wall time at 40 daemons before the 48 h runs.
name: sop_either_n40_speed
seed: 12345
base: test_configs/selfish_n40_sop.yaml
parallel: 1
stop_time: 6h
axes:
  arm:
    share:
      attacker:
        attributes:
          strategy: window_stubborn
          reject_aware: 'true'
          embedded_shares: 'true'
          window_objects: '48'
          weigh: sop
        daemon_options:
          sim-share-or-perish: true
          sim-sop-w: 16
          sim-sop-nf-rule: either
    block:
      attacker:
        attributes:
          strategy: window_stubborn
          reject_aware: 'true'
          window_objects: '48'
          weigh: sop
  countermeasure:
    sop2:
      honest:
        daemon_options:
          sim-share-or-perish: true
          sim-sop-w: 16
          sim-sop-nf-rule: either
      relays:
        daemon: monerod-sim
        daemon_options:
          sim-share-or-perish: true
          sim-sop-nf-rule: either
      bridges:
        daemon: monerod-sim
        daemon_options:
          sim-share-or-perish: true
          sim-sop-nf-rule: either
    stock:
      attacker:
        attributes:
          weigh: difficulty
          window_objects: '0'
  alpha:
    a033:
      attacker:
        hashrate: 3.3
      honest:
        hashrate:
        - 0.8375
        - 0.8375
        - 0.8375
        - 0.8375
        - 0.8375
        - 0.8375
        - 0.8375
        - 0.8375
  depth:
    d2:
      attacker:
        attributes:
          give_up_depth: '2'
exclude:
- arm: share
  countermeasure: stock
- arm: block
  countermeasure: sop2
ksm: true
