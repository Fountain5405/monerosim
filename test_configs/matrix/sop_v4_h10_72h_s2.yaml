# sop_v4_h10_72h_s2 (2026-10-22): second sample of cell 4 of
# sop_v4_h10_72h (share_sop2_hs_a045_d2, attacker share 0.078) for a
# per-run noise estimate -- every v4 cell so far is n=1, and the noown
# follow-up (sop_v4_noown_72h) is compared against exactly this cell.
# Identical config (tip_shares 'true', no count_own_tip_shares, so the
# reveal test counts the attacker's own tip shares, the campaign
# behavior); only the spec name differs, which isolates matrix_runs/
# markers and archived run names. Runs are not seed-reproducible
# (monerod is partly non-deterministic), so the same seed gives an
# independent sample, not a repetition.
name: sop_v4_h10_72h_s2
seed: 27791
base: test_configs/selfish_micro_sop.yaml
parallel: 1
stop_time: 72h
axes:
  arm:
    share:
      attacker:
        attributes:
          strategy: window_stubborn
          reject_aware: 'true'
          embedded_shares: 'true'
          window_rule: '20261020'
          window_objects: '32'
          weigh: sop
          use_honest_shares: 'true'
          tip_shares: 'true'
          give_up_depth: '5'
        daemon_options:
          sim-share-or-perish: true
          sim-sop-w: 16
  countermeasure:
    sop2:
      honest:
        daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}
      relays:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
      bridges:
        daemon: monerod-sim
        daemon_options: {sim-share-or-perish: true}
  shares:
    hs:
      attacker:
        attributes:
          use_honest_shares: 'true'
          tip_shares: 'true'
  alpha:
    a045:
      attacker: {hashrate: 4.5}
      honest: {hashrate: [2.75, 2.75]}
  depth:
    d2:
      attacker:
        attributes:
          give_up_depth: '2'
ksm: true
bootfast: true
