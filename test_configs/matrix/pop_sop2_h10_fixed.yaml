# SoP CORRECTED-BINARY RE-RUN (2026-09-30): campaign 6's SoP cells
# (pop_sop2_h10_reject) re-run on the SoP correction of 2026-09-30 (MRL #146):
# share-counted fallback weights, all published shares embedded in blocks,
# main-chain lateness reference, and whole-branch comparison. Configs are
# IDENTICAL to pop_sop2_h10_reject; only the binary under test differs. The
# countermeasure axis here carries only sop2 (the stock pairs need no
# re-run: a stock node's fork choice is unaffected by the SoP fix). First
# draw of an n=2 pair (second: pop_sop2_h10_fixed_rep.yaml, seed 54321).
#
#   venv/bin/python scripts/selfish_matrix.py test_configs/matrix/pop_sop2_h10_fixed.yaml
name: pop_sop2_h10_fixed
seed: 12345
base: test_configs/selfish_micro_sop.yaml
parallel: 2
axes:
  strategy:
    es:     {attacker: {attributes: {strategy: eyal_sirer, reject_aware: "true"}}}
    es_r2:  {attacker: {attributes: {strategy: eyal_sirer, release_lead: "2", reject_aware: "true"}}}
  countermeasure:
    sop2:
      honest: {daemon_options: {sim-share-or-perish: true, sim-sop-w: 16}}
      relays: {daemon: monerod-sim, daemon_options: {sim-share-or-perish: true}}
      bridges: {daemon: monerod-sim, daemon_options: {sim-share-or-perish: true}}
