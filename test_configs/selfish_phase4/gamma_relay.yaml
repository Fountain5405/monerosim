# Selfish-mining PHASE 4: gamma vs RELAY (the sim-only --sim-relay-alt-blocks flag)
# + per-agent placement (topology_node). Phase 3 proved placement alone can't lift
# gamma because stock monerod never relays the attacker's withheld tie-block. This
# config removes that barrier: the bridges run monerod-hf (= patched monerod-sim)
# with --sim-relay-alt-blocks, so a locally-submitted equal-height block IS relayed
# one hop into the honest network. Same placement as gamma_lift.yaml so RELAY is the
# only variable added vs phase 3.
#
# Placement (1200-node CAIDA GML; node id == index):
#   honest-001 -> 100, honest-002 -> 500, honest-003 -> 900  [spread far apart]
#   attacker-miner + bridge-1 (DETECTOR) -> 500 (central)
#   bridge-2 -> 100, bridge-3 -> 900, bridge-4 -> 300, bridge-5 -> 1100  [publishers near honest nodes]
# alpha=0.40, fixed-difficulty:1200, eyal_sirer, reaction 10ms.
general:
  stop_time: 6h
  simulation_seed: 12345
  bootstrap_end_time: 10m
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  process_threads: 2
  native_preemption: true
  mining:
    mode: native
  daemon_defaults:
    fixed-difficulty: 1200
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 1
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  honest-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 2
    start_time: 0s
    topology_node: 100
  honest-002:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 2
    start_time: 0s
    topology_node: 500
  honest-003:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 2
    start_time: 0s
    topology_node: 900
  attacker-miner:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.selfish_miner
    hashrate: 4
    start_time: 0s
    topology_node: 500
    daemon_options:
      offline: true
    attributes:
      strategy: eyal_sirer
      bridges: "bridge-1,bridge-2,bridge-3,bridge-4,bridge-5"
      attack_start_height: "0"
      reaction_delay_ms: "10"
  bridge-1:                      # DETECTOR: bridges[0], central; RELAY-ENABLED
    daemon: monerod-hf
    script: agents.selfish_bridge
    daemon_options:
      out-peers: 16
      sim-relay-alt-blocks: true
    start_time: 0s
    topology_node: 500
  bridge-2:                      # publisher near honest-001; RELAY-ENABLED
    daemon: monerod-hf
    script: agents.selfish_bridge
    daemon_options:
      out-peers: 16
      sim-relay-alt-blocks: true
    start_time: 0s
    topology_node: 100
  bridge-3:                      # publisher near honest-003; RELAY-ENABLED
    daemon: monerod-hf
    script: agents.selfish_bridge
    daemon_options:
      out-peers: 16
      sim-relay-alt-blocks: true
    start_time: 0s
    topology_node: 900
  bridge-4:                      # publisher in region 1; RELAY-ENABLED
    daemon: monerod-hf
    script: agents.selfish_bridge
    daemon_options:
      out-peers: 16
      sim-relay-alt-blocks: true
    start_time: 0s
    topology_node: 300
  bridge-5:                      # publisher in region 5; RELAY-ENABLED
    daemon: monerod-hf
    script: agents.selfish_bridge
    daemon_options:
      out-peers: 16
      sim-relay-alt-blocks: true
    start_time: 0s
    topology_node: 1100
  relay-001:
    daemon: monerod
    start_time: 30s
  relay-002:
    daemon: monerod
    start_time: 40s
  relay-003:
    daemon: monerod
    start_time: 50s
  relay-004:
    daemon: monerod
    start_time: 60s
  relay-005:
    daemon: monerod
    start_time: 70s
  relay-006:
    daemon: monerod
    start_time: 80s
  relay-007:
    daemon: monerod
    start_time: 90s
  relay-008:
    daemon: monerod
    start_time: 100s
  relay-009:
    daemon: monerod
    start_time: 110s
  relay-010:
    daemon: monerod
    start_time: 120s
  relay-011:
    daemon: monerod
    start_time: 130s
  relay-012:
    daemon: monerod
    start_time: 140s
  simulation-monitor:
    script: agents.simulation_monitor
    poll_interval: 300
