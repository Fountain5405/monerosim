# SoP blocks vs an unmodified monerod (2026-10-14).
# Derived from dev_snapshot_sop_smoke.yaml: attacker removed, one stock
# non-mining monerod added (stock-observer, no SoP flags, vote check on).
# Question: does stock v0.18 reject SoP blocks whose version_minor (= the
# workshare count) is below the current fork version (16)? Look for
# 'has old version' (verify category, now logged at INFO) in
# stock-observer's bitmonero.log.
general:
  fallback_seeds: custom
  stop_time: 20m
  simulation_seed: 12345
  bootstrap_end_time: 5m
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  process_threads: 2
  native_preemption: true
  mining:
    mode: native
    chain_snapshot: h50
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 1
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  honest-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 3
    start_time: 0s
    daemon_options:
      sim-share-or-perish: true
      sim-sop-w: 16
  honest-002:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 3
    start_time: 0s
    daemon_options:
      sim-share-or-perish: true
      sim-sop-w: 16
  relay-001:
    daemon: monerod-sim
    start_time: 30s
    daemon_options:
      sim-share-or-perish: true
  relay-002:
    daemon: monerod-sim
    start_time: 60s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-001:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-002:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-003:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-004:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-005:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  monero-seed-006:
    daemon: monerod-sim
    start_time: 5s
    daemon_options:
      sim-share-or-perish: true
  simulation-monitor:
    script: agents.simulation_monitor
    poll_interval: 300
  stock-observer:
    daemon: monerod
    start_time: 0s
    daemon_options:
      log-level: '*:WARNING,verify:INFO,blockchain:INFO,net.cn:INFO,global:INFO'
