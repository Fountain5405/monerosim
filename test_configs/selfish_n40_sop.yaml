# Larger selfish-mining base for SoP (2026-10-14): 40 daemons instead of 12.
# Derived from selfish_micro_sop.yaml (read its header for the design). Same
# general settings, h10 chain snapshot and CAIDA topology; changes:
# - 8 honest miners instead of 2. Total hashrate stays 10 h/s (the h10
#   snapshot's equilibrium, D0 = 1,200), so block-rate and revenue numbers stay
#   comparable with campaign 7; the matrix alpha axis sets the split.
# - 24 relays instead of 2, starting 30 s .. 260 s.
# - The attacker's offline miner and bridge, and the six declared seeds, as
#   before. Matrix "relays" overlays reach the seeds too.
# Daemons: 8 + 1 + 1 + 24 + 6 = 40.
general:
  fallback_seeds: custom
  stop_time: 6h
  simulation_seed: 12345
  bootstrap_end_time: 10m
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  process_threads: 2
  native_preemption: true
  mining:
    mode: native
    chain_snapshot: h10
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 1
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  honest-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 0.8375
    start_time: 0s
