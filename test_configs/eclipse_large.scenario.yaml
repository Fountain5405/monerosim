# Eclipse reproduction — LARGE SCALE (push CTR to 12/12).
# ~575-node Monero network. 550 real monerod attacker LISTENERS (distinct /24s)
# + 2 py-levin injectors, vs 20 benign relays + 6 honest seeds. The firewalled,
# outbound-only target is established first (benign/seed peers), then the
# attacker majority arrives (t=10m) and the protocol's own churn takes over all
# 12 outbound slots. 3h sim => ~100 update_sync_search rounds to displace even
# the sticky honest seed connection that left the 134-node run at 11/12.
general:
  stop_time: 3h
  simulation_seed: 12345
  bootstrap_end_time: 10m
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  runahead: 100ms
  process_threads: 128
  native_preemption: true
  reachable_fraction: 0.0          # only the (non-exempt) target is firewalled
  daemon_defaults:
    log-level: 1
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true

network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic

agents:
  miner-{001..004}:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 0s
    start_time_stagger: 1s
    hashrate: [25, 25, 25, 25]
    can_receive_distributions: true

  # 20 benign reachable relays (the honest network around the victim)
  relay-{001..020}:
    daemon: monerod
    start_time: 30s
    start_time_stagger: 1s
    attributes:
      eclipse_role: benign
    daemon_options:
      hide-my-port: false

  # the unreachable (firewalled, outbound-only) victim; established FIRST
  relay-900:
    daemon: monerod
    start_time: 60s
    attributes:
      eclipse_role: target

  # 550 attacker LISTENERS (real monerod, distinct /24s) = connectable endpoints,
  # arriving after the target is established.
  relay-{101..650}:
    daemon: monerod
    start_time: 10m
    start_time_stagger: 1s
    attributes:
      eclipse_role: attacker
    daemon_options:
      hide-my-port: false

  # 2 py-levin injectors (accelerate poisoning; modest dial load at this scale)
  relay-{701..702}:
    script: agents.eclipse_injector
    start_time: 9m
    attributes:
      eclipse_role: injector
      listen_port: "18080"
      dial_interval: "90"
      trash_count: "0"

  eclipse-monitor:
    script: agents.eclipse_monitor
    start_time: 120s
    attributes:
      poll_interval: "60"
      benign_sample: "20"
