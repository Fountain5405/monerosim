# Monerosim scaling test configuration
# Generated by generate_config.py
# Total hosts: 105 (5 miners + 100 users)
# Duration: 7h (extended from 6h)
# Network topology: gml_processing/1200_nodes_caida_with_loops.gml
#
# Activity stagger (prevents Shadow CPU starvation):
#   Stagger: 1s between users (interval/num_users)
#   Total rollout: ~1m 39s
#
# Timeline:
#   t=0:       Miners start
#   t=20m:      Users spawn in batches (see below)
#   t=1h 42m:  Last user spawns
#   t=4h:  Bootstrap ends (+20% buffer), distributor starts funding
#   t=5h:  Users start sending transactions (staggered over ~1m 39s)
# Batched bootstrap: 100 users in 5 batches
#   Batch 1: 5 users starting at 20m
#   Batch 2: 10 users starting at 40m
#   Batch 3: 20 users starting at 1h
#   Batch 4: 40 users starting at 1h 20m
#   Batch 5: 25 users starting at 1h 40m

metadata:
  scenario: default
  generator: generate_config.py
  version: '1.0'
  agents:
    total: 105
    miners: 5
    users: 100
  timing:
    duration_s: 25200
    bootstrap_end_s: 14400
    activity_start_s: 18000
    last_user_spawn_s: 6120
  batching:
    enabled: true
    batch_sizes:
      - 5
      - 10
      - 20
      - 40
      - 25
    batch_interval_s: 1200
  activity_stagger:
    stagger_s: 1
    tx_interval: 123
    total_rollout_s: 99
  settings:
    seed: 42
    gml_topology: gml_processing/1200_nodes_caida_with_loops.gml
    fast_mode: false
general:
  stop_time: 7h
  parallelism: 0
  simulation_seed: 42
  enable_dns_server: true
  fallback_seeds: auto
  shadow_log_level: info
  bootstrap_end_time: 4h
  progress: true
  native_preemption: true
  daemon_defaults:
    log-level: 1
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 1
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
