# SoP step-3 smoke: the #146 weight table armed on every honest node
# (sim-share-or-perish + w=16). Success: "weight table armed" + SIM-SoP
# fork-decision lines, chain converges, honest shares visibly COUNT (block
# weight > diff/w unit at fork evaluations), no storms. 12 sim-min.
general:
  stop_time: 12m
  simulation_seed: 12345
  bootstrap_end_time: 1m
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  process_threads: 2
  native_preemption: true
  mining:
    mode: native
  daemon_defaults:
    fixed-difficulty: 1800
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 1
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  miner-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 10
    start_time: 0s
    daemon_options:
      sim-sop-w: 16
      sim-share-or-perish: true
  miner-002:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 10
    start_time: 0s
    daemon_options:
      sim-sop-w: 16
      sim-share-or-perish: true
  relay-001:
    daemon: monerod-sim
    start_time: 30s
    daemon_options:
      sim-share-or-perish: true
  relay-002:
    daemon: monerod-sim
    start_time: 60s
    daemon_options:
      sim-share-or-perish: true
