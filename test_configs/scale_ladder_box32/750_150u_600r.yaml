general:
  stop_time: 10h
  simulation_seed: 12345
  bootstrap_end_time: 4h
  enable_dns_server: true
  mining:
    mode: native
  shadow_log_level: warning
  progress: true
  runahead: 100ms
  process_threads: 2
  native_preemption: false
  daemon_defaults:
    log-level: monitor
    rpc-ssl: autodetect
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 0
    rpc-ssl: autodetect
    daemon-ssl: autodetect
network:
  path: gml_processing/5000_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  miner-001:
    daemon: monerod
    wallet: 'monero-wallet-rpc'
    script: agents.autonomous_miner
    start_time: 0s
    hashrate: 20
    can_receive_distributions: true
  miner-002:
    daemon: monerod
    wallet: 'monero-wallet-rpc'
    script: agents.autonomous_miner
    start_time: 1s
    hashrate: 20
    can_receive_distributions: true
  miner-003:
    daemon: monerod
    wallet: 'monero-wallet-rpc'
    script: agents.autonomous_miner
