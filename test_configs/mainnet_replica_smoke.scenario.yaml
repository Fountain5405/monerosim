# MAINNET REPLICA — SMOKE (~100 honest + 12 spies). Plumbing check for
# mainnet_replica.scenario.yaml: mesh forms, spies connect, peerlist dumps
# are written. Too small for topology metrics: at N=100 the medium class is
# plumbing only, and hub caps are scaled to ~0.25*N.
# DRAFT, NOT YET RUN. See docs/superpowers/specs/2026-09-23-mainnet-replica-design.md
general:
  stop_time: 3h
  simulation_seed: 12345
  bootstrap_end_time: auto
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  runahead: 100ms
  process_threads: 2
  native_preemption: true
  reachable_fraction: 0.13
  turnover:
    mean_session: 1h
    mean_downtime: 1h
    fraction: 1.0
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 0

network:
  path: gml_processing/5000_nodes_caida_with_loops.gml
  peer_mode: Dynamic
  distribution:
    strategy: Weighted
    weights:
      north_america: 58
      europe: 30
      asia: 9
      oceania: 3
      south_america: 0
      africa: 0

agents:
  miner-{001..002}:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 0s
    start_time_stagger: 1s
    hashrate: [50, 50]
    can_receive_distributions: true

  supernode-001:
    daemon: monerod
    start_time: 0s
    daemon_options:
      out-peers: 25
      in-peers: 25
      hide-my-port: false

  medium-a-{001..012}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: auto
    daemon_options:
      out-peers: 16

  user-{001..020}:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.regular_user
    start_time: 1200s
    start_time_stagger: auto
    transaction_interval: 300
    activity_start_time: auto
    can_receive_distributions: true

  relay-{001..062}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: auto

  observer-{001..003}:
    daemon: monerod-hf
    start_time: 0s
    start_time_stagger: 3s
    daemon_options:
      hide-my-port: false
      peerlist-dump-file: "peerlist_dump.jsonl"

  spy-a-{001..006}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 832
    daemon_options: &spy_opts
      out-peers: 8
      hide-my-port: false
  spy-b-{001..006}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 833
    daemon_options: *spy_opts

  miner-distributor:
    script: agents.miner_distributor
    wait_time: auto

  simulation-monitor:
    script: agents.simulation_monitor
    poll_interval: 300
