# MAINNET REPLICA — SMOKE (~100 honest + 12 spies). Plumbing check for
# mainnet_replica.scenario.yaml: mesh forms on the chain snapshot, miners act as
# hubs, medium nodes turn over while reachable, prefix sharing places nodes,
# spies connect, observer peerlist dumps are written.
# Too small for topology metrics: at N=100 the medium class is plumbing only,
# and hub caps are scaled to ~0.25*N.
# Uses the same 5 x 10 h/s miners as the full replica so it resolves the same
# chain snapshot preset (chain_snapshots/h50).
# See docs/superpowers/specs/2026-09-23-mainnet-replica-design.md
general:
  stop_time: 3h
  simulation_seed: 12345
  bootstrap_end_time: auto
  enable_dns_server: true
  shadow_log_level: warning
  progress: true
  runahead: 100ms
  process_threads: 2
  native_preemption: true
  reachable_fraction: 0.01
  mining:
    mode: native
    chain_snapshot: auto
  turnover:
    mean_session: 1h
    mean_downtime: 1h
    fraction: 1.0
  daemon_defaults:
    log-level: monitor
    max-log-file-size: 0
    db-sync-mode: fastest
    no-zmq: true
    non-interactive: true
  wallet_defaults:
    log-level: 0

network:
  path: gml_processing/5000_nodes_caida_with_loops.gml
  peer_mode: Dynamic
  distribution:
    strategy: Weighted
    prefix_sharing:
      fraction: 0.31
      per_prefix: 3
    weights:
      north_america: 58
      europe: 30
      asia: 9
      oceania: 3
      south_america: 0
      africa: 0

agents:
  # Miners are the hubs (native mining; caps ~0.25*N at this scale).
  miner-{001..005}:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    start_time: 0s
    start_time_stagger: 1s
    hashrate: [10, 10, 10, 10, 10]
    can_receive_distributions: true
    daemon_options:
      out-peers: 25
      in-peers: 25
      hide-my-port: false

  # Medium: pinned reachable, still turning over (G2).
  medium-a-{001..012}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: auto
    turnover: true
    daemon_options:
      out-peers: 16
      hide-my-port: false

  user-{001..020}:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.regular_user
    start_time: 1200s
    start_time_stagger: auto
    transaction_interval: 300
    activity_start_time: auto
    can_receive_distributions: true

  relay-{001..060}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: auto

  observer-{001..003}:
    daemon: monerod-hf
    start_time: 0s
    start_time_stagger: 3s
    daemon_options:
      hide-my-port: false
      peerlist-dump-file: "peerlist_dump.jsonl"

  # Real-node spies (variant R), 2 dense /24s.
  spy-a-{001..006}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 832
    daemon_options: &spy_opts
      out-peers: 8
      hide-my-port: false
  spy-b-{001..006}:
    daemon: monerod
    start_time: 0s
    start_time_stagger: 2s
    topology_node: 833
    daemon_options: *spy_opts

  miner-distributor:
    script: agents.miner_distributor
    wait_time: auto

  simulation-monitor:
    script: agents.simulation_monitor
    poll_interval: 300
