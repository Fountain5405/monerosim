general:
  stop_time: 1800
  seed: 12345
  parallelism: 0
  model_unblocked_syscall_latency: true
  log_level: info
  progress: true
network:
  graph:
    type: gml
    file:
      path: TMPDIR/topology.gml
  dns_server: 3.0.0.10
experimental:
  use_dynamic_runahead: true
hosts:
  dnsserver:
    network_node_id: 0
    ip_addr: 3.0.0.10
    processes:
    - path: /bin/bash
      args:
      - TMPDIR/scripts/dns_server_wrapper.sh
      environment:
        DIFFICULTY_CACHE_TTL: '30'
        GLIBC_TUNABLES: glibc.malloc.arena_max=1
        HOME: HOME
        MALLOC_ARENA_MAX: '1'
        MALLOC_MMAP_THRESHOLD_: '131072'
        MALLOC_TRIM_THRESHOLD_: '131072'
        MONEROSIM_DAEMON_DATA_DIR: /tmp
        MONEROSIM_SHARED_DIR: TMPDIR/shared
        PROCESS_THREADS: '2'
        PYTHONHASHSEED: '0'
        PYTHONUNBUFFERED: '1'
        SIMULATION_SEED: '12345'
        VENV_SITE_PACKAGES: REPO_ROOT/venv/lib/python3.12/site-packages
      start_time: 1s
      expected_final_state: running
    bandwidth_down: '1000000000'
    bandwidth_up: '1000000000'
  miner-001:
    network_node_id: 0
    ip_addr: 3.0.0.11
    processes:
    - path: HOME/.monerosim/bin/monerod-sim
      args:
      - --data-dir=/tmp/monero-miner-001
      - --log-file=TMPDIR/bitmonero.log
      - --regtest
      - --keep-fakechain
      - --prep-blocks-threads=2
      - --max-concurrency=2
      - --log-level=*:WARNING,blockchain:INFO,txpool:INFO,net.p2p.msg:INFO,daemon.rpc:INFO,global:INFO,stacktrace:INFO,logging:INFO,msgwriter:INFO,verify:FATAL,serialization:FATAL,perf.*:FATAL
      - --max-connections-per-ip=4
      - --no-zmq
      - --non-interactive
      - --sim-hash-interval-ms=50
      - --sim-rx-full-dataset
      - --rpc-bind-ip=3.0.0.11
      - --rpc-bind-port=18081
      - --confirm-external-bind
      - --rpc-access-control-origins=*
      - --p2p-bind-ip=3.0.0.11
      - --p2p-bind-port=18080
      - --add-priority-node=2.0.0.10:18080
      - --add-priority-node=2.0.0.10:18080
      environment:
        DIFFICULTY_CACHE_TTL: '30'
        DNS_PUBLIC: tcp://3.0.0.10
        GLIBC_TUNABLES: glibc.malloc.arena_max=1
        HOME: HOME
        MALLOC_ARENA_MAX: '1'
        MALLOC_MMAP_THRESHOLD_: '131072'
        MALLOC_TRIM_THRESHOLD_: '131072'
        MONEROSIM_DAEMON_DATA_DIR: /tmp
        MONEROSIM_SHARED_DIR: TMPDIR/shared
        MONERO_BLOCK_SYNC_SIZE: '1'
        PROCESS_THREADS: '2'
        PYTHONHASHSEED: '0'
        PYTHONUNBUFFERED: '1'
        SIMULATION_SEED: '12345'
        VENV_SITE_PACKAGES: REPO_ROOT/venv/lib/python3.12/site-packages
      start_time: 0s
      expected_final_state: running
    - path: HOME/.monerosim/bin/monero-wallet-rpc
