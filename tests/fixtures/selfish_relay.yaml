general:
  stop_time: 30m
  simulation_seed: 12345
  enable_dns_server: true
  process_threads: 2
  mining:
    mode: native
    chain_snapshot: off
  daemon_defaults:
    log-level: monitor
    no-zmq: true
    non-interactive: true
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  honest-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 6
    start_time: 0s
  attacker-miner:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.selfish_miner
    hashrate: 4
    start_time: 0s
    daemon_options:
      offline: true
    attributes:
      strategy: eyal_sirer
      bridge_agent: attacker-bridge
      attack_start_height: "0"
      reaction_delay_ms: "200"
  attacker-bridge:
    daemon: monerod-hf
    script: agents.selfish_bridge
    start_time: 0s
    daemon_options:
      sim-relay-alt-blocks: true
  relay-001:
    daemon: monerod
    start_time: 30s
