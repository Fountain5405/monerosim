general:
  stop_time: 30m
  simulation_seed: 12345
  enable_dns_server: true
  process_threads: 2
  mining:
    mode: native
  daemon_defaults:
    log-level: monitor
    no-zmq: true
    non-interactive: true
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  miner-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 20
    start_time: 0s
  miner-002:
    daemon: monerod-sim
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 3
    start_time: 0s
  relay-001:
    daemon: monerod
    start_time: 30s
