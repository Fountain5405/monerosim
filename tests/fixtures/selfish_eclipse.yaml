# Eclipse x selfish composition fixture (experiment 3).
# The attacker runs an ISLAND bridge: an isolated relay whose only peers are
# eclipsed victims pinned to it via peers.exclusive. The agent mirrors its
# private chain onto the island (victims unknowingly extend it) and pulls the
# victims' blocks back, so the offline miner's chain IS the combined branch
# and the existing release path cashes it. attributes.eclipsed keeps victims
# and the island out of the miner ring and everyone's seed lists.
general:
  stop_time: 30m
  simulation_seed: 12345
  enable_dns_server: true
  process_threads: 2
  mining:
    mode: native
  daemon_defaults:
    log-level: monitor
    no-zmq: true
    non-interactive: true
network:
  path: gml_processing/1200_nodes_caida_with_loops.gml
  peer_mode: Dynamic
agents:
  honest-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 4
    start_time: 0s
  honest-002:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 4
    start_time: 0s
  attacker-miner:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.selfish_miner
    hashrate: 4
    start_time: 0s
    daemon_options:
      offline: true
    attributes:
      strategy: eyal_sirer
      bridges: attacker-bridge
      islands: attacker-island
      attack_start_height: "0"
      reaction_delay_ms: "200"
  attacker-bridge:
    daemon: monerod
    script: agents.selfish_bridge
    start_time: 0s
  attacker-island:
    daemon: monerod
    script: agents.selfish_bridge
    start_time: 0s
    daemon_options:
      offline: true
    attributes:
      eclipsed: "true"
  victim-001:
    daemon: monerod
    wallet: monero-wallet-rpc
    script: agents.autonomous_miner
    hashrate: 3
    start_time: 15m
    daemon_options:
      offline: true
    attributes:
      eclipsed: "true"
      mine_after_height: "3"
  relay-001:
    daemon: monerod
    start_time: 30s
